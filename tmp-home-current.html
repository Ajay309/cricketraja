  <script type="text/javascript">
    (function () {
      var cacheKey = "clientAddr";
      var cacheAtKey = "clientAddrAt";
      var now = Date.now();
      var cachedIp = String(localStorage.getItem(cacheKey) || "").trim();
      var cachedAt = Number(localStorage.getItem(cacheAtKey) || 0);
      if (cachedIp && cachedAt > 0 && now - cachedAt < 24 * 60 * 60 * 1000) {
        IP_ADDRESS = cachedIp;
        return;
      }
      fetch("/api.ipify.org?format=json")
        .then(function (response) {
          if (!response || !response.ok) return null;
          return response.json().catch(function () {
            return null;
          });
        })
        .then(function (json) {
          var ip = String(json && json.ip ? json.ip : "").trim();
          if (!ip) return;
          IP_ADDRESS = ip;
          localStorage.setItem(cacheKey, ip);
          localStorage.setItem(cacheAtKey, String(now));
        })
        .catch(function () {});
    })();

    function getWidth() {
      var doc = document,
        w = window;
      var docEl =
        doc.compatMode && doc.compatMode === "CSS1Compat"
          ? doc.documentElement
          : doc.body;

      var width = docEl.clientWidth;
      var height = docEl.clientHeight;

      if (w.innerWidth && width > w.innerWidth) {
        width = w.innerWidth;
        height = w.innerHeight;
      }
      return width;
    }
    IS_MOBILE = getWidth() < 1280 ? true : false;
    IS_TABLET = getWidth() >= 768 ? true : false;

    IP_ADDRESS = localStorage.getItem("clientAddr");

    DOMAIN = "allpanelexch.com";
    LOGO_PATH = "/admin/assets/images/diamondexch-logo.png";
    THEME = "dark";
  </script>
  <script type="text/javascript">
    (function () {
      if (window.__localRecaptchaShimReady) return;
      window.__localRecaptchaShimReady = true;

      var widgets = {};
      var nextId = 1;

      function buildToken() {
        return "local-recaptcha-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
      }
      window.__localRecaptchaToken = buildToken;

      function ensureWidget(id) {
        if (!widgets[id]) {
          widgets[id] = { token: "", params: {} };
        }
        return widgets[id];
      }

      var shim = {
        ready: function (cb) {
          if (typeof cb === "function") cb();
        },
        render: function (_container, params) {
          var id = nextId++;
          widgets[id] = {
            token: "",
            params: params || {}
          };
          return id;
        },
        execute: function (id) {
          var widget = ensureWidget(id);
          var token = buildToken();
          widget.token = token;
          if (widget.params && typeof widget.params.callback === "function") {
            setTimeout(function () {
              try {
                widget.params.callback(token);
              } catch (_e) {}
            }, 0);
          }
          return token;
        },
        executeAsync: function (id) {
          return Promise.resolve(this.execute(id));
        },
        getResponse: function (id) {
          var widget = ensureWidget(id);
          if (!widget.token) {
            widget.token = buildToken();
          }
          return widget.token;
        },
        reset: function (id) {
          if (widgets[id]) {
            widgets[id].token = "";
          }
        }
      };

      if (!window.grecaptcha || typeof window.grecaptcha.render !== "function") {
        window.grecaptcha = shim;
      }

      if (typeof window.onloadcallback === "function") {
        try {
          window.onloadcallback();
        } catch (_e) {}
      }
    })();
  </script>
  <script type="text/javascript">
    (function () {
      if (window.__localWelcomeBannerInjected) return;
      window.__localWelcomeBannerInjected = true;

      var path = String((window.location && window.location.pathname) || "").toLowerCase();
      if (path.indexOf("/admin") === 0) {
        return;
      }

      var POPUP_ID = "local-welcome-banner-popup";
      var STYLE_ID = "local-welcome-banner-style";
      var DISMISS_KEY = "localWelcomeBannerDismissed";
      var BANNER_SRC = "/sitethemedata.com/common/wel-banner/wel-1772484069516.png";
      var ENABLE_WELCOME_BANNER = false;

      if (!ENABLE_WELCOME_BANNER) {
        return;
      }

      function isHomeRoute() {
        var p = String((window.location && window.location.pathname) || "").toLowerCase();
        return p === "/home";
      }

      function ensureStyle() {
        if (document.getElementById(STYLE_ID)) return;
        var style = document.createElement("style");
        style.id = STYLE_ID;
        style.textContent = [
          ".local-welcome-overlay{position:fixed;inset:0;background: rgba(107, 62, 30, 0.42);z-index:2147483640;display:flex;align-items:flex-start;justify-content:center;padding:108px 12px 16px;overflow:auto;}",
          ".local-welcome-card{width:min(1000px,calc(100vw - 40px));background: #6B3E1E;border-radius:2px;box-shadow: 0 18px 45px rgba(0,0,0,.45);overflow:hidden;}",
          ".local-welcome-head{height:44px;background: #6B3E1E;display:flex;justify-content:flex-end;align-items:center;padding:0 10px;}",
          ".local-welcome-close{border: 0;background: transparent;color: #fff;font-size:52px;line-height:1;cursor:pointer;padding:0 6px;}",
          ".local-welcome-image-wrap{background: #6B3E1E;display:flex;align-items:center;justify-content:center;}",
          ".local-welcome-image{width:100%;height:auto;display:block;}",
          "@media (max-width:900px){.local-welcome-overlay{padding:14px 8px}.local-welcome-card{width:min(1000px,calc(100vw - 16px))}.local-welcome-head{height:40px}.local-welcome-close{font-size:44px}}"
        ].join("");
        document.head.appendChild(style);
      }

      function closePopup() {
        var node = document.getElementById(POPUP_ID);
        if (node && node.parentNode) {
          node.parentNode.removeChild(node);
        }
        try {
          sessionStorage.setItem(DISMISS_KEY, "1");
        } catch (_e) {}
      }

      function buildPopup() {
        if (document.getElementById(POPUP_ID)) return;
        ensureStyle();

        var overlay = document.createElement("div");
        overlay.id = POPUP_ID;
        overlay.className = "local-welcome-overlay";

        var card = document.createElement("div");
        card.className = "local-welcome-card";

        var head = document.createElement("div");
        head.className = "local-welcome-head";

        var topClose = document.createElement("button");
        topClose.className = "local-welcome-close";
        topClose.type = "button";
        topClose.setAttribute("aria-label", "Close");
        topClose.textContent = "\u00d7";
        topClose.addEventListener("click", closePopup);
        head.appendChild(topClose);

        var imageWrap = document.createElement("div");
        imageWrap.className = "local-welcome-image-wrap";
        var image = document.createElement("img");
        image.className = "local-welcome-image";
        image.src = BANNER_SRC;
        image.alt = "Welcome Banner";
        imageWrap.appendChild(image);

        card.appendChild(head);
        card.appendChild(imageWrap);
        overlay.appendChild(card);

        overlay.addEventListener("click", function (event) {
          if (event.target === overlay) {
            closePopup();
          }
        });

        document.body.appendChild(overlay);
      }

      function maybeShowBanner() {
        var current = String((window.location && window.location.pathname) || "").toLowerCase();
        if (current === "/" || current === "/login") {
          try {
            sessionStorage.removeItem(DISMISS_KEY);
          } catch (_e) {}
        }
        if (!isHomeRoute()) return;
        try {
          if (sessionStorage.getItem(DISMISS_KEY) === "1") return;
        } catch (_e) {}
        window.setTimeout(buildPopup, 700);
      }

      function installRouteListeners() {
        if (window.__localWelcomeBannerRouteHooked) return;
        window.__localWelcomeBannerRouteHooked = true;

        var rawPushState = history.pushState;
        var rawReplaceState = history.replaceState;
        history.pushState = function () {
          var result = rawPushState.apply(this, arguments);
          window.setTimeout(maybeShowBanner, 160);
          return result;
        };
        history.replaceState = function () {
          var result = rawReplaceState.apply(this, arguments);
          window.setTimeout(maybeShowBanner, 160);
          return result;
        };
        window.addEventListener("popstate", function () {
          window.setTimeout(maybeShowBanner, 160);
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", maybeShowBanner);
      } else {
        maybeShowBanner();
      }

      installRouteListeners();
    })();
  </script>
  <script type="text/javascript">
    (function () {
      if (window.__localMediaGuardInstalled) return;
      window.__localMediaGuardInstalled = true;

      var currentPath = String((window.location && window.location.pathname) || "").toLowerCase();
      if (currentPath.indexOf("/admin") === 0) {
        return;
      }
      var shouldMonitorMediaRoute = /\/(?:all-sports|casino|game-details|(?:new)?mediaplayer)\//i.test(currentPath);
      if (!shouldMonitorMediaRoute) {
        return;
      }

      var STYLE_ID = "local-media-guard-style";
      var mediaSrcRegex = /\/(?:new)?mediaplayer\//i;
      var badInlineRegex = /^\s*(?:no\s*content:|not\s*found:\s*\/(?:new)?mediaplayer\/|404\b)/i;

      function ensureStyle() {
        if (document.getElementById(STYLE_ID)) return;
        var style = document.createElement("style");
        style.id = STYLE_ID;
        style.textContent =
          ".local-hide-invalid-media{display:none !important;height:0 !important;min-height:0 !important;max-height:0 !important;margin:0 !important;padding:0 !important;border: 0 !important;overflow:hidden !important;}";
        document.head.appendChild(style);
      }

      function collapseNode(node) {
        if (!node || node.__localMediaCollapsed) return;
        node.__localMediaCollapsed = true;
        node.classList.add("local-hide-invalid-media");
      }

      function findFrameContainer(iframe) {
        if (!iframe) return null;
        var container = iframe.closest(
          ".video-box-container,.casino-video-box,.live-tv,.scorestats,.video-box,.score-card,.tv-wrap,.tv-container,.stream-box"
        );
        if (container) return container;
        var parent = iframe.parentElement;
        if (parent && parent.childElementCount <= 2) {
          return parent;
        }
        return iframe;
      }

      function isBrokenMediaText(text) {
        var source = String(text || "").trim();
        if (!source) return false;
        if (/^\.$/.test(source)) return true;
        return (
          /^no\s*content:/i.test(source) ||
          /^not\s*found:\s*\/(?:new)?mediaplayer\//i.test(source) ||
          /page\s*not\s*found/i.test(source) ||
          /^404\b/.test(source)
        );
      }

      function inspectFrame(iframe) {
        if (!iframe) return;
        var src = String(iframe.getAttribute("src") || iframe.src || "");
        if (!mediaSrcRegex.test(src)) return;
        try {
          var doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
          if (!doc || !doc.body) return;
          var text = String(doc.body.innerText || doc.body.textContent || "");
          if (!isBrokenMediaText(text)) return;
          collapseNode(findFrameContainer(iframe));
        } catch (_e) {}
      }

      function wireFrame(iframe) {
        if (!iframe || iframe.__localMediaGuardWired) return;
        iframe.__localMediaGuardWired = true;
        iframe.addEventListener("load", function () {
          inspectFrame(iframe);
        });
        window.setTimeout(function () {
          inspectFrame(iframe);
        }, 900);
        window.setTimeout(function () {
          inspectFrame(iframe);
        }, 2600);
      }

      function collapseInlineNoContentBlocks() {
        if (!document.body) return;
        var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
        var node = walker.nextNode();
        var hits = 0;
        while (node && hits < 12) {
          var text = String(node.nodeValue || "").trim();
          if (text && text.length <= 260 && badInlineRegex.test(text)) {
            var holder = node.parentElement;
            if (holder) {
              var block = holder.closest("div,section,article,pre,p,span") || holder;
              if (block && !block.querySelector("table")) {
                collapseNode(block);
                hits += 1;
              }
            }
          }
          node = walker.nextNode();
        }
      }

      function scanMediaBlocks() {
        ensureStyle();
        var frames = document.querySelectorAll("iframe");
        for (var i = 0; i < frames.length; i += 1) {
          wireFrame(frames[i]);
        }
        collapseInlineNoContentBlocks();
      }

      var scanTimer = null;
      function scheduleScan() {
        if (document.hidden) return;
        if (scanTimer) return;
        scanTimer = window.setTimeout(function () {
          scanTimer = null;
          scanMediaBlocks();
        }, 120);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", scanMediaBlocks);
      } else {
        scanMediaBlocks();
      }

      var observer = new MutationObserver(scheduleScan);
      observer.observe(document.body || document.documentElement, { childList: true, subtree: true });
      window.setInterval(function () {
        if (document.hidden) return;
        scanMediaBlocks();
      }, 12000);
    })();
  </script>
