<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Worli3 Media</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;background: #000;
        overflow: hidden;
      }

      #player {
        width: 100%;
        height: 100%;border: 0;
        display: block;background: #000;
      }

      #loader {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;color: #7f8c8d;
        font-family: Arial, sans-serif;
        font-size: 13px;background: #5e6164;
      }
    </style>
  </head>
  <body>
    <iframe
      id="player"
      allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
    <div id="loader">Loading live video...</div>
    <script>
      (function () {
        var DEFAULT_PRIMARY = "https://11xplay.global/casino-detail/99995/150001";
        var DEFAULT_FALLBACK = "https://11xplay.global/casino-detail/99995/150071";
        var player = document.getElementById("player");
        var loader = document.getElementById("loader");
        var retried = false;

        function normalizeTarget(rawUrl) {
          var value = String(rawUrl || "").trim();
          if (!value) {
            return DEFAULT_PRIMARY;
          }

          try {
            value = decodeURIComponent(value);
          } catch (err) {
            // keep raw
          }

          if (/^#\//i.test(value)) {
            value = "/" + value.replace(/^#\/+/, "");
          }

          if (/^\/(?:casino-detail|dashboard)\b/i.test(value)) {
            return "https://11xplay.global" + value;
          }

          try {
            var parsed = new URL(value, window.location.origin);
            if (!/^https?:$/i.test(parsed.protocol)) {
              return DEFAULT_PRIMARY;
            }

            if (/^11xplay\.global$/i.test(parsed.hostname)) {
              if (/^#\/(?:casino-detail|dashboard)\b/i.test(parsed.hash || "")) {
                return "https://11xplay.global/" + String(parsed.hash || "").replace(/^#\/+/, "");
              }
              return parsed.toString();
            }

            return parsed.toString();
          } catch (err2) {
            return DEFAULT_PRIMARY;
          }
        }

        function hideLoader() {
          if (loader) {
            loader.style.display = "none";
          }
        }

        function loadExternal(target) {
          if (!player) {
            return;
          }
          player.src = target;
        }

        var params = new URLSearchParams(window.location.search || "");
        var ext = params.get("ext") || "";
        var targetUrl = normalizeTarget(ext);

        player.addEventListener("load", function () {
          hideLoader();
        });

        // If first launch target fails silently, retry once with an alternate
        // direct casino-detail URL (never bounce to dashboard/login landing).
        window.setTimeout(function () {
          if (loader && loader.style.display !== "none" && !retried) {
            retried = true;
            loadExternal(DEFAULT_FALLBACK);
          }
        }, 9000);

        window.setTimeout(function () {
          hideLoader();
        }, 15000);

        loadExternal(targetUrl);
      })();
    </script>
  </body>
</html>
