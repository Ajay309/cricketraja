<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="266" viewBox="0 0 1080 266" role="img" aria-label="DHONI EXCH99 logo">
  <defs>
    <filter id="engrave" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="2" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComposite in="mono" in2="SourceAlpha" operator="in" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="screen"/>
    </filter>
  </defs>
  <rect width="1080" height="266" fill="#000000" />
  <g fill="#ffffff" filter="url(#engrave)" font-family="'Old English Text MT', 'Cinzel Decorative', Georgia, serif" font-weight="700">
    <text x="38" y="124" font-size="126" letter-spacing="3">DHONI</text>
    <text x="84" y="248" font-size="126" letter-spacing="4">EXCH</text>
    <text x="620" y="230" font-size="312" letter-spacing="6">99</text>
  </g>
</svg>
